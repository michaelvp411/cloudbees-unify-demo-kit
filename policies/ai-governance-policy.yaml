policy:
  name: ai-governance-policy
  description: AI governance policy for AI-assisted software delivery. The aiAssistedChanges section is enforced by the ai-change-guardrail jobs in .cloudbees/workflows/ci.yaml.
  controls:
    requireSharedContext: true
    restrictUnapprovedMcpServers: true
    requireHumanApprovalForProductionChanges: true
    logAssistantActions: true
  aiAssistedChanges:
    detection:
      # Commit trailer naming an AI assistant, e.g. "Co-Authored-By: Claude ..."
      trailerPattern: "^Co-Authored-By:.*(Claude|Copilot|Cursor|Codex|Gemini|Devin|Windsurf)"
      # Explicit marker in the commit message, e.g. "[ai-generated]"
      labelPattern: "ai-generated"
    guardrails:
      # false = report-only: AI changes are detected and logged as evidence,
      # but nothing is gated.
      enforceGuardrails: true
      # Checks run on every AI-assisted change. All pass: the change ships with
      # no human in the loop. Any fails (or its evidence is missing): a human
      # reviews it, and a secret finding also needs an explicit exception.
      # The secret scan covers the lines this change adds to src/.
      requireCleanSecretScan: true
      maxChangedLines: 400
      # Evidence from another CI on the same commit: this GitHub Actions
      # workflow must have succeeded.
      externalCiRepo: michaelvp411/cloudbees-unify-demo-kit
      externalCiWorkflow: External CI - Build Test Scan
  demoTalkingPoint: AI reviews the code, policy decides when that is enough, humans own the exceptions.
