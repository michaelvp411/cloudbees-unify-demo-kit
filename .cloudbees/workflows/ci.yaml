apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci-build-test-scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ai_assisted:
        type: choice
        description: Override AI-assisted detection (auto reads the commit trailers)
        options:
          - auto
          - "yes"
          - "no"
        default: auto
permissions:
  id-token: write
  contents: read
jobs:
  validate:
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Validate repository structure
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Validating demo repository structure"
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          test -f helm/unify-demo-app/Chart.yaml
          echo "Repository structure is ready"
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Validate — repository structure
            - `k8s/deployment.yaml`: present
            - `k8s/service.yaml`: present
            - `helm/unify-demo-app/Chart.yaml`: present
            - Status: **ready**
  # AI change guardrail: enforces the aiAssistedChanges section of
  # policies/ai-governance-policy.yaml. AI-assisted commits (detected from
  # commit trailers or an [ai-generated] marker) get three checks: a secret
  # scan of the lines they add, a churn limit, and the GitHub Actions result
  # for the same commit. All pass: the artifact is registered with no human.
  # Any fails: a human reviews, and a secret needs an explicit exception.
  ai-change-guardrail:
    needs:
      - validate
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
        with:
          fetch-depth: 2
      - name: Detect AI-assisted change and apply checks
        id: detect
        uses: docker://alpine:3.20
        shell: sh
        env:
          # Dispatch runs carry inputs in the event payload; push runs don't, and
          # referencing cloudbees.event.inputs directly fails on push.
          EVENT_JSON: ${{ toJSON(cloudbees.event) }}
        run: |
          apk add --no-cache git curl jq >/dev/null
          git config --global --add safe.directory '*'
          POLICY=policies/ai-governance-policy.yaml
          policy_value() { grep -m1 "^ *$1:" "$POLICY" | sed 's/^[^:]*: *//; s/^"//; s/"$//'; }
          TRAILER_PATTERN=$(policy_value trailerPattern)
          LABEL_PATTERN=$(policy_value labelPattern)
          MAX_LINES=$(policy_value maxChangedLines)
          ENFORCE=$(policy_value enforceGuardrails)
          EXT_REPO=$(policy_value externalCiRepo)
          EXT_WORKFLOW=$(policy_value externalCiWorkflow)

          MSG=$(git log -1 --format=%B)
          AI=no
          REASON="no AI trailer or marker in commit"
          if echo "$MSG" | grep -qiE "$TRAILER_PATTERN"; then
            AI=yes; REASON="trailer: $(echo "$MSG" | grep -iE "$TRAILER_PATTERN" | head -1)"
          elif echo "$MSG" | grep -qi "$LABEL_PATTERN"; then
            AI=yes; REASON="marker: $LABEL_PATTERN"
          fi
          OVERRIDE=$(echo "$EVENT_JSON" | grep -o '"ai_assisted": *"[a-z]*"' | sed 's/.*"\([a-z]*\)"$/\1/')
          case "$OVERRIDE" in
            yes) AI=yes; REASON="manual override (workflow input)" ;;
            no)  AI=no;  REASON="manual override (workflow input)" ;;
          esac

          # Secret scan: hardcoded credentials this change adds to src/.
          # Pre-existing ones are the Security tab's job, not this change's.
          SECRETS=0
          CHANGED=0
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            SECRETS=$(git diff -U0 HEAD~1 HEAD -- src/ | grep '^+[^+]' | grep -ciE '(password|passwd|secret|api[_-]?key|token) *= *"[^"]+"' || true)
            # Churn: lines added + deleted by this commit.
            CHANGED=$(git diff --numstat HEAD~1 HEAD | awk '{s+=$1+$2} END {print s+0}')
          fi
          CHURN=ok
          [ "$CHANGED" -gt "$MAX_LINES" ] && CHURN=high

          # External CI: the GitHub Actions run for this commit. Missing
          # evidence counts as a failed check, so a human looks at it.
          SHA=$(git rev-parse HEAD)
          EXT_CI=missing
          for i in 1 2 3 4 5 6 7 8; do
            RUN=$(curl -fsS "https://api.github.com/repos/$EXT_REPO/actions/runs?head_sha=$SHA" 2>/dev/null \
              | jq -r --arg w "$EXT_WORKFLOW" --arg sha "$SHA" '[.workflow_runs[] | select(.name == $w and .head_sha == $sha)][0] | "\(.status) \(.conclusion)"' 2>/dev/null)
            case "$RUN" in
              "completed success") EXT_CI=success; break ;;
              completed*) EXT_CI=failed; break ;;
            esac
            sleep 15
          done

          FAILED=""
          [ "$SECRETS" != "0" ] && FAILED="$FAILED secret-scan"
          [ "$CHURN" = "high" ] && FAILED="$FAILED churn"
          [ "$EXT_CI" != "success" ] && FAILED="$FAILED external-ci"
          FAILED=$(echo $FAILED)
          NEEDS_HUMAN=no
          [ -n "$FAILED" ] && NEEDS_HUMAN=yes

          echo "AI-assisted: $AI ($REASON)"
          echo "Secret scan (added lines): $SECRETS finding(s)"
          echo "Changed lines: $CHANGED (policy max $MAX_LINES) -> churn $CHURN"
          echo "GitHub Actions '$EXT_WORKFLOW' on $SHA: $EXT_CI"
          echo "Failed checks: ${FAILED:-none} -> human review needed: $NEEDS_HUMAN"
          # printf, not echo: a trailing newline breaks == comparisons in job if conditions.
          printf '%s' "$AI" > "$CLOUDBEES_OUTPUTS/ai-assisted"
          printf '%s' "$REASON" > "$CLOUDBEES_OUTPUTS/reason"
          printf '%s' "$SECRETS" > "$CLOUDBEES_OUTPUTS/secret-findings"
          printf '%s' "$CHANGED" > "$CLOUDBEES_OUTPUTS/changed-lines"
          printf '%s' "$CHURN" > "$CLOUDBEES_OUTPUTS/churn"
          printf '%s' "$ENFORCE" > "$CLOUDBEES_OUTPUTS/enforce"
          printf '%s' "$EXT_CI" > "$CLOUDBEES_OUTPUTS/external-ci"
          printf '%s' "${FAILED:-none}" > "$CLOUDBEES_OUTPUTS/failed-checks"
          printf '%s' "$NEEDS_HUMAN" > "$CLOUDBEES_OUTPUTS/needs-human"
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## AI change guardrail — checks
            - AI-assisted: **${{ steps.detect.outputs.ai-assisted }}** (${{ steps.detect.outputs.reason }})
            - Policy: `policies/ai-governance-policy.yaml` (aiAssistedChanges)
            - Secret scan (lines added to `src/`): ${{ steps.detect.outputs.secret-findings }} finding(s)
            - Churn: ${{ steps.detect.outputs.changed-lines }} lines changed (${{ steps.detect.outputs.churn }})
            - GitHub Actions "External CI - Build Test Scan" on this commit: **${{ steps.detect.outputs.external-ci }}**
            - Failed checks: **${{ steps.detect.outputs.failed-checks }}**, human review needed: **${{ steps.detect.outputs.needs-human }}**
            - Enforcement: ${{ steps.detect.outputs.enforce }} (`enforceGuardrails` in the policy; false = report-only)
    outputs:
      ai-assisted: ${{ steps.detect.outputs.ai-assisted }}
      reason: ${{ steps.detect.outputs.reason }}
      secret-findings: ${{ steps.detect.outputs.secret-findings }}
      changed-lines: ${{ steps.detect.outputs.changed-lines }}
      churn: ${{ steps.detect.outputs.churn }}
      enforce: ${{ steps.detect.outputs.enforce }}
      external-ci: ${{ steps.detect.outputs.external-ci }}
      failed-checks: ${{ steps.detect.outputs.failed-checks }}
      needs-human: ${{ steps.detect.outputs.needs-human }}
  # Only AI changes that failed a check reach a human.
  ai-guardrail-approval:
    needs:
      - ai-change-guardrail
      - security-scan
    if: ${{ needs.ai-change-guardrail.outputs.ai-assisted == 'yes' && needs.ai-change-guardrail.outputs.enforce == 'true' && needs.ai-change-guardrail.outputs.needs-human == 'yes' }}
    with:
      instructions: "AI-assisted change (${{ needs.ai-change-guardrail.outputs.reason }}) failed policy checks: ${{ needs.ai-change-guardrail.outputs.failed-checks }}. Secrets added: ${{ needs.ai-change-guardrail.outputs.secret-findings }}. Churn: ${{ needs.ai-change-guardrail.outputs.changed-lines }} lines (${{ needs.ai-change-guardrail.outputs.churn }}). GitHub Actions: ${{ needs.ai-change-guardrail.outputs.external-ci }}. Review the change. If it adds a secret, the artifact is registered only if you grant a security exception."
      disallowLaunchByUser: false
      approvalInputs: |
        security-exception-granted:
          type: boolean
          default: false
        churn-reviewed:
          type: boolean
          default: true
    timeout-minutes: 60
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
  # Every check passed: policy approves, no human. Records the decision; the
  # package job below runs on the same condition.
  ai-guardrail-policy-pass:
    needs:
      - ai-change-guardrail
    if: ${{ needs.ai-change-guardrail.outputs.ai-assisted == 'yes' && needs.ai-change-guardrail.outputs.enforce == 'true' && needs.ai-change-guardrail.outputs.needs-human == 'no' }}
    steps:
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## AI change guardrail — result
            - AI-assisted: **yes** (${{ needs.ai-change-guardrail.outputs.reason }})
            - Secret scan: clean. Churn: ${{ needs.ai-change-guardrail.outputs.changed-lines }} lines (${{ needs.ai-change-guardrail.outputs.churn }}). GitHub Actions: ${{ needs.ai-change-guardrail.outputs.external-ci }}
            - Human approval: **not required**, every policy check passed
            - Result: **approved by policy**, artifact registration allowed
  ai-guardrail-enforce:
    needs:
      - ai-change-guardrail
      - ai-guardrail-approval
    if: ${{ needs.ai-change-guardrail.outputs.ai-assisted == 'yes' && needs.ai-change-guardrail.outputs.enforce == 'true' && needs.ai-change-guardrail.outputs.needs-human == 'yes' }}
    steps:
      - name: Enforce clean secret scan or approved exception
        id: enforce
        uses: docker://alpine:3.20
        shell: sh
        env:
          AI: ${{ needs.ai-change-guardrail.outputs.ai-assisted }}
          REASON: ${{ needs.ai-change-guardrail.outputs.reason }}
          FINDINGS: ${{ needs.ai-change-guardrail.outputs.secret-findings }}
          CHANGED: ${{ needs.ai-change-guardrail.outputs.changed-lines }}
          CHURN: ${{ needs.ai-change-guardrail.outputs.churn }}
          EXT_CI: ${{ needs.ai-change-guardrail.outputs.external-ci }}
          # Empty when the approval gate was skipped, so parse it here rather than with fromJSON.
          APPROVAL: ${{ needs.ai-guardrail-approval.outputs.approvalInputValues }}
        run: |
          approval_value() { echo "$APPROVAL" | grep -o "\"$1\": *\"\?[a-z]*" | sed 's/.*[": ]//'; }
          EXCEPTION=$(approval_value security-exception-granted)
          CHURN_REVIEWED=$(approval_value churn-reviewed)
          echo "Secret findings: $FINDINGS, security exception granted: ${EXCEPTION:-none}"
          if [ "$FINDINGS" != "0" ] && [ "$EXCEPTION" != "true" ]; then
            echo "AI guardrail: secret scan not clean and no exception granted. Blocking artifact registration."
            exit 1
          fi
          printf '%s' "- AI-assisted: **yes** ($REASON)
          - Human approval: **approved** (failed checks needed review)
          - Secret scan: $FINDINGS finding(s), security exception granted: ${EXCEPTION:-n/a}
          - GitHub Actions: $EXT_CI
          - Churn: $CHANGED lines ($CHURN), reviewed: ${CHURN_REVIEWED:-n/a}
          - Result: **guardrails applied**, artifact registration allowed" > "$CLOUDBEES_OUTPUTS/summary"
          echo "AI guardrail passed."
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## AI change guardrail — result
            ${{ steps.enforce.outputs.summary }}
  unit-tests:
    needs:
      - validate
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Run unit tests
        uses: docker://node:20-alpine
        shell: sh
        run: |
          echo "Running unit tests for orders-api (recorded results in test-reports/junit.xml)"
          echo "14 passed, 1 failed, 1 skipped"
      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        continue-on-error: true
        with:
          test-type: JUNIT
          results-path: test-reports/junit.xml
      # Same results to CloudBees Smart Tests, which tracks flaky tests and
      # trends across builds from every CI (GitHub Actions sends them too).
      # Needs the SMART_TESTS_TOKEN secret in Unify: Unify fails the whole
      # workflow if it is missing. A Smart Tests outage doesn't fail the build.
      - name: Record results in Smart Tests
        uses: docker://python:3.13-slim
        continue-on-error: true
        shell: sh
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          pip install -q smart-tests-cli
          BUILD="orders-api-1.4.${{ cloudbees.run_number }}-unify"
          smart-tests record build --build "$BUILD" --branch main --no-commit-collection --commit "cloudbees-unify-demo-kit=${{ cloudbees.scm.sha }}"
          smart-tests record session --build "$BUILD" --test-suite unit > session.txt
          smart-tests record tests --session @session.txt --allow-test-before-build pytest test-reports/junit.xml
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Unit tests — orders-api
            - Tests: 16
            - Passed: 14
            - Failed: 1 (`test_retry_on_gateway_timeout`)
            - Skipped: 1
            - Results published to the **Test results** tab
  security-scan:
    needs:
      - unit-tests
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Note on automatic security scanning
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "CloudBees Unify scans this repository on every push, whichever CI builds it:"
          echo "Gitleaks (secrets), Checkov (infrastructure as code), SCC."
          echo "Findings appear in the component's Security tab."
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Security — automatic scanning
            CloudBees Unify scans this repository on every push, whichever CI builds it
            (Gitleaks for secrets, Checkov for infrastructure as code, SCC). Findings
            are in the component's **Security** tab for triage and remediation tracking.
  # Not gated (not AI-assisted, report-only, or every check passed): package now.
  package:
    needs:
      - security-scan
      - ai-change-guardrail
    if: ${{ needs.ai-change-guardrail.outputs.ai-assisted != 'yes' || needs.ai-change-guardrail.outputs.enforce != 'true' || needs.ai-change-guardrail.outputs.needs-human == 'no' }}
    uses: ./.cloudbees/workflows/package.yaml
    with:
      approved-by: automatic (no review required by policy)
  # Gated: package only after a human reviewed it and enforce passed.
  package-after-review:
    needs:
      - security-scan
      - ai-change-guardrail
      - ai-guardrail-enforce
    if: ${{ needs.ai-change-guardrail.outputs.ai-assisted == 'yes' && needs.ai-change-guardrail.outputs.enforce == 'true' && needs.ai-change-guardrail.outputs.needs-human == 'yes' }}
    uses: ./.cloudbees/workflows/package.yaml
    with:
      approved-by: human review (failed checks)
