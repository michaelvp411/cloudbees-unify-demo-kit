apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci-build-test-scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ai_assisted:
        type: choice
        description: Override AI-assisted detection (auto reads the commit trailers)
        options:
          - auto
          - "yes"
          - "no"
        default: auto
permissions:
  id-token: write
  contents: read
jobs:
  validate:
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Validate repository structure
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Validating demo repository structure"
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          test -f helm/unify-demo-app/Chart.yaml
          echo "Repository structure is ready"
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Validate — repository structure
            - `k8s/deployment.yaml`: present
            - `k8s/service.yaml`: present
            - `helm/unify-demo-app/Chart.yaml`: present
            - Status: **ready**
  # AI change guardrail: enforces the aiAssistedChanges section of
  # policies/ai-governance-policy.yaml. AI-assisted commits (detected from
  # commit trailers or an [ai-generated] marker) get a secret scan, a churn
  # check, and a required human approval before the artifact is registered.
  ai-change-guardrail:
    needs:
      - validate
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
        with:
          fetch-depth: 2
      - name: Detect AI-assisted change and apply checks
        id: detect
        uses: docker://alpine:3.20
        shell: sh
        env:
          # Dispatch runs carry inputs in the event payload; push runs don't, and
          # referencing cloudbees.event.inputs directly fails on push.
          EVENT_JSON: ${{ toJSON(cloudbees.event) }}
        run: |
          apk add --no-cache git >/dev/null
          git config --global --add safe.directory '*'
          POLICY=policies/ai-governance-policy.yaml
          policy_value() { grep -m1 "^ *$1:" "$POLICY" | sed 's/^[^:]*: *//; s/^"//; s/"$//'; }
          TRAILER_PATTERN=$(policy_value trailerPattern)
          LABEL_PATTERN=$(policy_value labelPattern)
          MAX_LINES=$(policy_value maxChangedLines)

          MSG=$(git log -1 --format=%B)
          AI=no
          REASON="no AI trailer or marker in commit"
          if echo "$MSG" | grep -qiE "$TRAILER_PATTERN"; then
            AI=yes; REASON="trailer: $(echo "$MSG" | grep -iE "$TRAILER_PATTERN" | head -1)"
          elif echo "$MSG" | grep -qi "$LABEL_PATTERN"; then
            AI=yes; REASON="marker: $LABEL_PATTERN"
          fi
          OVERRIDE=$(echo "$EVENT_JSON" | grep -o '"ai_assisted": *"[a-z]*"' | sed 's/.*"\([a-z]*\)"$/\1/')
          case "$OVERRIDE" in
            yes) AI=yes; REASON="manual override (workflow input)" ;;
            no)  AI=no;  REASON="manual override (workflow input)" ;;
          esac

          # Secret scan: hardcoded credentials in source.
          SECRETS=$(grep -rniE '(password|passwd|secret|api[_-]?key|token) *= *"[^"]+"' src/ | wc -l | tr -d ' ')

          # Churn: lines added + deleted by this commit.
          CHANGED=0
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            CHANGED=$(git diff --numstat HEAD~1 HEAD | awk '{s+=$1+$2} END {print s+0}')
          fi
          CHURN=ok
          [ "$CHANGED" -gt "$MAX_LINES" ] && CHURN=high

          echo "AI-assisted: $AI ($REASON)"
          echo "Secret scan findings: $SECRETS"
          echo "Changed lines: $CHANGED (policy max $MAX_LINES) -> churn $CHURN"
          # printf, not echo: a trailing newline breaks == comparisons in job if conditions.
          printf '%s' "$AI" > "$CLOUDBEES_OUTPUTS/ai-assisted"
          printf '%s' "$REASON" > "$CLOUDBEES_OUTPUTS/reason"
          printf '%s' "$SECRETS" > "$CLOUDBEES_OUTPUTS/secret-findings"
          printf '%s' "$CHANGED" > "$CLOUDBEES_OUTPUTS/changed-lines"
          printf '%s' "$CHURN" > "$CLOUDBEES_OUTPUTS/churn"
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## AI change guardrail — detection
            - AI-assisted: **${{ steps.detect.outputs.ai-assisted }}** (${{ steps.detect.outputs.reason }})
            - Policy: `policies/ai-governance-policy.yaml` (aiAssistedChanges)
            - Secret scan: ${{ steps.detect.outputs.secret-findings }} hardcoded credential(s) in `src/`
            - Churn: ${{ steps.detect.outputs.changed-lines }} lines changed (${{ steps.detect.outputs.churn }})
            - Next: AI-assisted changes require human approval before the artifact is registered
    outputs:
      ai-assisted: ${{ steps.detect.outputs.ai-assisted }}
      reason: ${{ steps.detect.outputs.reason }}
      secret-findings: ${{ steps.detect.outputs.secret-findings }}
      changed-lines: ${{ steps.detect.outputs.changed-lines }}
      churn: ${{ steps.detect.outputs.churn }}
  ai-guardrail-approval:
    needs:
      - ai-change-guardrail
      - security-scan
    if: ${{ needs.ai-change-guardrail.outputs.ai-assisted == 'yes' }}
    with:
      instructions: "AI-assisted change detected (${{ needs.ai-change-guardrail.outputs.reason }}). Secret scan: ${{ needs.ai-change-guardrail.outputs.secret-findings }} finding(s). Churn: ${{ needs.ai-change-guardrail.outputs.changed-lines }} lines (${{ needs.ai-change-guardrail.outputs.churn }}). Review the change. The artifact is registered only if the secret scan is clean or you grant a security exception."
      disallowLaunchByUser: false
      approvalInputs: |
        security-exception-granted:
          type: boolean
          default: false
        churn-reviewed:
          type: boolean
          default: true
    timeout-minutes: 60
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
  ai-guardrail-enforce:
    needs:
      - ai-change-guardrail
      - ai-guardrail-approval
    if: ${{ needs.ai-change-guardrail.outputs.ai-assisted == 'yes' }}
    steps:
      - name: Enforce clean secret scan or approved exception
        id: enforce
        uses: docker://alpine:3.20
        shell: sh
        env:
          AI: ${{ needs.ai-change-guardrail.outputs.ai-assisted }}
          REASON: ${{ needs.ai-change-guardrail.outputs.reason }}
          FINDINGS: ${{ needs.ai-change-guardrail.outputs.secret-findings }}
          CHANGED: ${{ needs.ai-change-guardrail.outputs.changed-lines }}
          CHURN: ${{ needs.ai-change-guardrail.outputs.churn }}
          # Empty when the approval gate was skipped, so parse it here rather than with fromJSON.
          APPROVAL: ${{ needs.ai-guardrail-approval.outputs.approvalInputValues }}
        run: |
          approval_value() { echo "$APPROVAL" | grep -o "\"$1\": *\"\?[a-z]*" | sed 's/.*[": ]//'; }
          if [ "$AI" != "yes" ]; then
            printf '%s' "- AI-assisted: **no** ($REASON)
          - Result: standard pipeline, AI guardrails not required" > "$CLOUDBEES_OUTPUTS/summary"
            echo "Not AI-assisted: guardrails not required."
            exit 0
          fi
          EXCEPTION=$(approval_value security-exception-granted)
          CHURN_REVIEWED=$(approval_value churn-reviewed)
          echo "Secret findings: $FINDINGS, security exception granted: ${EXCEPTION:-none}"
          if [ "$FINDINGS" != "0" ] && [ "$EXCEPTION" != "true" ]; then
            echo "AI guardrail: secret scan not clean and no exception granted. Blocking artifact registration."
            exit 1
          fi
          printf '%s' "- AI-assisted: **yes** ($REASON)
          - Human approval: **approved**
          - Secret scan: $FINDINGS finding(s), security exception granted: ${EXCEPTION:-n/a}
          - Churn: $CHANGED lines ($CHURN), reviewed: ${CHURN_REVIEWED:-n/a}
          - Result: **guardrails applied**, artifact registration allowed" > "$CLOUDBEES_OUTPUTS/summary"
          echo "AI guardrail passed."
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## AI change guardrail — result
            ${{ steps.enforce.outputs.summary }}
  # SIMULATED: illustrates CloudBees Smart Tests (formerly Launchable)
  # predictive test selection. No Smart Tests service is called; the numbers
  # below are illustrative, not measured.
  smart-test-selection:
    needs:
      - validate
    steps:
      - name: Select tests for this change (simulated)
        kind: test
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "SIMULATED: CloudBees Smart Tests predictive test selection"
          echo "Full suite:     1,200 tests, ~47 min"
          echo "Selected subset:  260 tests, ~10 min (ranked by likelihood of catching a failure for this change)"
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Smart test selection — SIMULATED
            > Illustrative numbers. This step does not call CloudBees Smart Tests.
            - Product: CloudBees Smart Tests (formerly Launchable), predictive test selection
            - Full suite: 1,200 tests, ~47 min
            - Selected for this change: 260 tests, ~10 min (~79% less test time; CloudBees cites up to 80%)
            - Skipped tests stay visible: Smart Tests reports what ran, what was skipped, and why
  unit-tests:
    needs:
      - smart-test-selection
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Run unit tests
        uses: docker://node:20-alpine
        shell: sh
        run: |
          echo "Running unit tests for orders-api (recorded results in test-reports/junit.xml)"
          echo "14 passed, 1 failed, 1 skipped"
      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        continue-on-error: true
        with:
          test-type: JUNIT
          results-path: test-reports/junit.xml
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Unit tests — orders-api
            - Tests: 16
            - Passed: 14
            - Failed: 1 (`test_retry_on_gateway_timeout`)
            - Skipped: 1
            - Results published to the **Test results** tab
  security-scan:
    needs:
      - unit-tests
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Note on automatic security scanning
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "CloudBees Unify automatically scans connected repositories for"
          echo "secrets and vulnerabilities."
          echo "Findings appear in the component's Security tab — including the"
          echo "hardcoded credential intentionally added in src/config.py."
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Security — automatic scanning
            CloudBees Unify automatically scans this repository. Findings — including
            the **hardcoded credential** in `src/config.py` — are shown in the
            component's **Security** tab for triage and remediation tracking.
  package:
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Create build metadata
        kind: build
        uses: docker://alpine:3.20
        shell: sh
        run: |
          mkdir -p build
          cat > build/release-metadata.json <<JSON
          {
            "application": "customer-portal",
            "component": "orders-api",
            "version": "1.4.${{ cloudbees.run_number }}",
            "commit": "${{ cloudbees.scm.sha }}",
            "scenario": "candidate-demo",
            "securityPolicy": "1 open finding",
            "testStatus": "14/16 passed, 1 failed, 1 skipped"
          }
          JSON
          cat build/release-metadata.json
      - name: Register build artifact
        id: register-artifact
        uses: cloudbees-io/register-build-artifact@v2
        with:
          name: orders-api
          version: 1.4.${{ cloudbees.run_number }}
          url: docker.io/cloudbeesdemo/orders-api:1.4.${{ cloudbees.run_number }}
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Package — build metadata + registered artifact
            - Application: customer-portal
            - Component: orders-api
            - Version: 1.4.${{ cloudbees.run_number }}
            - Registered artifact ID: ${{ steps.register-artifact.outputs.artifact-id }}
            - Artifact URL: docker.io/cloudbeesdemo/orders-api:1.4.${{ cloudbees.run_number }}
            - Commit: ${{ cloudbees.scm.sha }}
            - Security: 1 open finding (hardcoded credential), see Security tab
            - Tests: 14/16 passed, 1 failed (`test_retry_on_gateway_timeout`), 1 skipped
    needs:
      - security-scan
      - ai-guardrail-enforce
    # Unify still runs this job when ai-guardrail-enforce is skipped, and skips it
    # when enforce fails, so no if condition is needed.
    outputs:
      artifact-id: ${{ steps.register-artifact.outputs.artifact-id }}
      artifact-version: 1.4.${{ cloudbees.run_number }}
