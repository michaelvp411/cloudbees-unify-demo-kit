name: QA smoke tests
# The QA team's GitHub Actions workflow. Unify picks up its runs next to the
# Unify-native CI. The release's feature flags live in Unify under
# FinSure Payments Platform.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  qa-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests
        run: |
          echo "orders-api smoke: GET /health -> 200"
          echo "orders-api smoke: POST /orders -> 201"
          echo "checkout smoke:   payment gateway timeout path -> retried 2/3 (known failure)"
