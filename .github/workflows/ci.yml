name: External CI - Build Test Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          echo "Build orders-api"
          mkdir -p build
          echo "demo artifact" > build/orders-api.txt
      - name: Unit tests
        run: |
          echo "orders-api unit tests: 14 passed, 1 failed (test_retry_on_gateway_timeout), 1 skipped"
      - name: Security scan placeholder
        run: |
          echo "Secret and IaC scanning: CloudBees Unify scans this repo on push (see the Security tab)"
      - name: Publish release evidence
        run: |
          cat > release-evidence.json <<JSON
          {
            "application": "finsure-mobile-banking",
            "component": "orders-api",
            "build": "${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "tests": "14/16 passed, 1 failed, 1 skipped",
            "security": "see Unify Security tab"
          }
          JSON
          cat release-evidence.json
