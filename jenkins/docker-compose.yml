services:
  jenkins:
    build: .
    container_name: unify-demo-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      DEMO_REPO_URL: ${DEMO_REPO_URL:-https://github.com/michaelvp411/cloudbees-unify-demo-kit.git}
    volumes:
      - jenkins_home:/var/jenkins_home
volumes:
  jenkins_home:
