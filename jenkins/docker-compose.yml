services:
  jenkins:
    build: .
    container_name: unify-demo-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      GITHUB_OWNER: ${GITHUB_OWNER:-michaelvp411}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in jenkins/.env (see .env.example)}
      GITHUB_REPO: ${GITHUB_REPO:-cloudbees-unify-demo-kit}
    volumes:
      - jenkins_home:/var/jenkins_home
volumes:
  jenkins_home:
