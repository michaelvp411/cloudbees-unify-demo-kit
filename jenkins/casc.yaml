jenkins:
  systemMessage: "CloudBees Unify demo kit: external Jenkins CI for orders-api"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
jobs:
  # Multibranch with a GitHub branch source: the only job shape CloudBees Unify tracks.
  - script: |
      multibranchPipelineJob('orders-api') {
        description('orders-api CI from the Jenkinsfile in this repo, reported to CloudBees Unify')
        branchSources {
          branchSource {
            source {
              github {
                id('orders-api')
                repoOwner('${GITHUB_OWNER:-michaelvp411}')
                repository('${GITHUB_REPO:-cloudbees-unify-demo-kit}')
                repositoryUrl('https://github.com/${GITHUB_OWNER:-michaelvp411}/${GITHUB_REPO:-cloudbees-unify-demo-kit}')
                configuredByUrl(true)
                credentialsId('github')
                traits {
                  gitHubBranchDiscovery { strategyId(1) }
                  gitHubPullRequestDiscovery { strategyId(1) }
                }
              }
            }
          }
        }
        factory { workflowBranchProjectFactory { scriptPath('Jenkinsfile') } }
        triggers { periodicFolderTrigger { interval('5m') } }
      }
